<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
<title>How a file moves between the untracked, unmodified, modified and staged states in Git</title>
<rect width="800" height="350" fill="#04090f"/>
<path d="M115.0 44V330" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="1.5"/>
<rect x="65.9" y="14.5" width="98.1" height="29" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.3)"/><text x="115.0" y="33.5" text-anchor="middle" font-size="13" fill="#f7f8f8">untracked</text>
<path d="M305.0 44V330" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="1.5"/>
<rect x="252.0" y="14.5" width="106.0" height="29" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.3)"/><text x="305.0" y="33.5" text-anchor="middle" font-size="13" fill="#f7f8f8">unmodified</text>
<path d="M495.0 44V330" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="1.5"/>
<rect x="449.9" y="14.5" width="90.2" height="29" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.3)"/><text x="495.0" y="33.5" text-anchor="middle" font-size="13" fill="#f7f8f8">modified</text>
<path d="M685.0 44V330" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="1.5"/>
<rect x="647.8" y="14.5" width="74.4" height="29" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.3)"/><text x="685.0" y="33.5" text-anchor="middle" font-size="13" fill="#f7f8f8">staged</text>
<path d="M115.0 100H677.0" stroke="#7aa2ff" stroke-width="1.5"/><path d="M685.0 100l-9 -5v10z" fill="#7aa2ff"/><text x="400.0" y="89" text-anchor="middle" font-size="13" fill="#f7f8f8">add the file</text>
<path d="M305.0 150H487.0" stroke="#7aa2ff" stroke-width="1.5"/><path d="M495.0 150l-9 -5v10z" fill="#7aa2ff"/><text x="400.0" y="139" text-anchor="middle" font-size="13" fill="#f7f8f8">edit the file</text>
<path d="M495.0 200H677.0" stroke="#7aa2ff" stroke-width="1.5"/><path d="M685.0 200l-9 -5v10z" fill="#7aa2ff"/><text x="590.0" y="189" text-anchor="middle" font-size="13" fill="#f7f8f8">stage the file</text>
<path d="M305.0 250H123.0" stroke="#7aa2ff" stroke-width="1.5"/><path d="M115.0 250l9 -5v10z" fill="#7aa2ff"/><text x="210.0" y="239" text-anchor="middle" font-size="13" fill="#f7f8f8">remove the file</text>
<path d="M685.0 300H313.0" stroke="#7aa2ff" stroke-width="1.5"/><path d="M305.0 300l9 -5v10z" fill="#7aa2ff"/><text x="495.0" y="289" text-anchor="middle" font-size="13" fill="#f7f8f8">commit</text>
</svg>
