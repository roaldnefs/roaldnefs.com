{{- $page := . -}}
<article class="cell card">
  {{ with partial "tags.html" $page }}
    <div class="kicker">{{ index . 0 }}</div>
  {{ end }}
  <h3 class="cell-title">
    <a href="{{ $page.RelPermalink }}">{{ $page.Title }}</a>
  </h3>
  <p class="cell-summary">{{ $page.Summary | plainify | truncate 160 }}</p>
  <div class="cell-meta">
    <time datetime="{{ $page.Date.Format "2006-01-02" }}">{{ $page.Date.Format "Jan 2, 2006" }}</time>
    <span>&middot; {{ $page.ReadingTime }} min read</span>
  </div>
</article>
