<div class="consent" role="region" aria-label="Cookie consent" data-consent data-ga-id="{{ site.Config.Services.GoogleAnalytics.ID }}" hidden>
  <div class="consent-text">
    <p class="consent-prompt"><span aria-hidden="true">$ </span>load google-analytics? [y/N]</p>
    <p>It shows me which posts get read. It also sets cookies and phones home to Google, so it stays off unless you say yes. <a href="{{ "/cookies/" | relURL }}">man cookies</a></p>
  </div>
  <div class="consent-actions">
    <button type="button" data-consent-choice="granted"><span aria-hidden="true">[y] </span>accept</button>
    <button type="button" data-consent-choice="denied"><span aria-hidden="true">[n] </span>decline</button>
  </div>
</div>
