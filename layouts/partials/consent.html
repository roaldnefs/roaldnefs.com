<div class="consent" role="region" aria-label="Cookie consent" data-consent data-ga-id="{{ site.Config.Services.GoogleAnalytics.ID }}" hidden>
  <p>This site uses Google Analytics to see which posts get read. It sets cookies, so it only runs if you accept. See the <a href="{{ "/cookies/" | relURL }}">cookie statement</a>.</p>
  <div class="consent-actions">
    <button class="btn btn--sm" type="button" data-consent-choice="granted">Accept</button>
    <button class="btn btn--sm btn--ghost" type="button" data-consent-choice="denied">Decline</button>
  </div>
</div>
