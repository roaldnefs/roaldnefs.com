<header class="site-header">
  <div class="site-header-inner">
    <a class="site-title" href="{{ "/" | relURL }}">
      <img class="site-title-cutout" src="{{ "/images/authors/roald-nefs-avatar.webp" | relURL }}" alt="" width="135" height="180">
      <span>{{ site.Title }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle-cb" aria-hidden="true">
    <nav class="site-nav" aria-label="Primary">
      <div class="site-nav-links">
        {{ range site.Menus.main }}
          {{ if not .Params.icon }}
            {{ $url := relURL .PageRef }}
            {{ $current := or (eq $.RelPermalink $url) (and (ne $url "/") (hasPrefix $.RelPermalink $url)) }}
            <a href="{{ $url }}" class="nav-link"{{ if $current }} aria-current="page"{{ end }}>
              <span>{{ .Name }}</span>
              <svg class="nav-link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </a>
          {{ end }}
        {{ end }}
      </div>
    </nav>
    <label for="nav-toggle" class="nav-toggle" aria-label="Toggle menu" role="button" tabindex="0">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </label>
  </div>
</header>
