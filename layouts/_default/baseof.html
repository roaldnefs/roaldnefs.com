<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body{{ if or (eq .Section "posts") .Params.toc }}{{ if .IsPage }} class="has-aside"{{ end }}{{ end }}>
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="backdrop" aria-hidden="true"></div>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ if and hugo.IsProduction site.Params.googleTagManager }}{{ partial "consent.html" . }}{{ end }}
</body>
</html>
